# Runtime settings and signature provenance.
# This file is copied next to nikooo777.dll by CMake and loaded from there.
#
# Keep the evidence with the bytes: source/source_readme/source_video explain
# how a signature was found; operand_offset, instruction_offset,
# instruction_length, and indirections explain how the runtime turns the match
# into an address.

[settings]
require_unique=true
validate_pointers=true
log_match_offsets=true

[features]
bhop=true
aimbot=true
triggerbot=true
norecoil=true
# Read-only camera correction in ClientMode::OverrideView slot 16.
visual_norecoil=true
# The x86 cone path is not runtime-validated; keep compensation off by default.
perfect_nospread=false
# Return false from CreateMove after cmd angle mutation so its caller leaves
# the compensated simulation angles out of the render camera.
silent_angles=true
menu_open=false

[signature.ClientState]
module=engine.dll
pattern=B9 ? ? ? ? E8 ? ? ? ? FF 75 FC E8 ? ? ? ? 83
operand=abs32
operand_offset=1
indirections=0
required=true
validate_vtable=false
description=Engine code site whose B9 imm32 operand resolves the ClientState object.
discovery=In Ghidra, locate the client-state access, confirm the B9 imm32 instruction, and keep stable surrounding control-flow bytes while wildcarding relocatable operands.
source=aidocs/001_signature-scanning-and-offsets.md
source_readme=README.md#videos--notes-while-reversing
source_video=https://www.youtube.com/watch?v=J6vO-ANi4Q8
notes=Confirm from surrounding instructions that the immediate is the final object address before treating indirections=0 as correct.

[signature.ClientMode]
module=client.dll
pattern=8B 0D ? ? ? ? 8B 01 5D FF 60 28 CC
operand=abs32
operand_offset=2
indirections=1
required=true
validate_vtable=true
description=ClientMode access that loads a global ClientMode pointer and dispatches through its vtable.
discovery=In Ghidra, confirm MOV ECX dword ptr [global], MOV EAX [ECX], and the vtable dispatch; wildcard the four-byte global address.
source=aidocs/001_signature-scanning-and-offsets.md
source_readme=README.md#tutorial-notes
notes=The sample match was client.dll+0xE6CA3; that observation is provenance, not a replacement for scanning the loaded module.

[signature.WeaponInfoLookup]
module=client.dll
pattern=55 8B EC 66 8B 45 08 66 3B 05 ? ? ? ? 73 1A B9 FF FF 00 00 66 3B C1 74 10 0F B7 C8 A1 ? ? ? ? 03 C9 8B 44 C8 0C 5D C3 B8 ? ? ? ? 5D C3
operand=match
required=false
validate_vtable=false
description=Weapon-info table lookup used by the fire path to compute the next accuracy penalty.
discovery=In Ghidra, follow the GetCSWpnData/weapon-info call from the x86 fire wrapper and confirm the ushort lookup, table stride, and fallback return before using its result.
source=aidocs/005_no-spread-and-weapon-accuracy.md
source_readme=README.md#tutorial-notes
notes=The match is the function entry at client.dll+0x1C0C50 in the sample x86 client; operand=match returns the function address rather than a data operand.

[interface.ClientEntityList]
module=client.dll
name=VClientEntityList003
required=true
discovery=In Ghidra, search client.dll strings for VClientEntityList003, follow its interface-registration reference, and verify the IClientEntityList method order before calling GetClientEntity.
source=aidocs/003_global-addresses-and-inputs.md
source_readme=README.md#tutorial-notes
notes=Prefer the named interface over a copied entity-list global. The implementation translates player slot 0 to entity index 1 and validates the returned interface vtable.

[interface.EngineClient]
module=engine.dll
name=VEngineClient013
required=true
discovery=In the Source SDK interface declaration, confirm GetViewAngles at vtable slot 19, then verify the VEngineClient013 registration in the loaded engine module.
source=aidocs/003_global-addresses-and-inputs.md
source_readme=README.md#tutorial-notes
notes=Use the named interface and vtable slot instead of copying a ClientState view-angle displacement.

[interface.EngineTrace]
module=engine.dll
name=EngineTraceClient003
required=true
discovery=In the matching Source SDK IEngineTrace declaration, confirm EngineTraceClient003 and TraceRay at vtable slot 4, then verify the interface registration in the loaded engine module.
source=aidocs/004_x64-migration-and-abi.md
source_readme=README.md#tutorial-notes
notes=Visibility uses MASK_VISIBLE and a filter that skips the local player and candidate; re-verify the interface and slot after a binary update.
