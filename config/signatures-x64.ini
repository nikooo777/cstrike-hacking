# x64 runtime settings and signature provenance for the current CS:S x64 build.
# CMake copies this file to signatures.ini beside the DLL for an x64 build.
#
# The x64 client uses RIP-relative rel32 operands instead of the x86 absolute
# imm32 operands in config/signatures.ini. For RIP-relative operands,
# instruction_offset identifies the instruction inside the matched pattern.
# Re-check every pattern in Ghidra after a game update; require_unique=true is
# intentional.

[settings]
require_unique=true
validate_pointers=true
log_match_offsets=true

[features]
bhop=true
# Bone cache and IClientNetworkable::IsDormant are mapped for this build.
aimbot=true
# Keep triggerbot off until its complete input/target path is validated.
triggerbot=false
norecoil=true
visual_norecoil=true
# Perfect nospread compensates cmd angles from seed+radii; default off.
perfect_nospread=false
# Return false from CreateMove after cmd angle mutation so its caller leaves
# the compensated simulation angles out of the render camera.
silent_angles=true
menu_open=false

[signature.ClientState]
module=engine.dll
pattern=48 83 EC 28 48 8D 0D ?? ?? ?? ?? E8 00 C6 09 00 48 8D 0D ?? ?? ?? ?? 48 83 C4 28 E9 6C F7 30 00
operand=rip_rel32
operand_offset=7
instruction_offset=4
instruction_length=7
indirections=0
required=true
validate_vtable=false
description=Engine static initializer whose first LEA resolves the live CClientState object.
discovery=In Ghidra, confirm CClientState construction at engine.dll+0xA0DF0, then search for the unique initializer with the LEA, constructor call, cleanup LEA, and tail jump sequence.
source=aidocs/004_x64-migration-and-abi.md
source_readme=README.md#tutorial-notes
notes=The current x64 match is engine.dll+0x47E0 and its first RIP-relative LEA resolves engine.dll+0x535810. The call and tail-jump rel32 bytes are kept exact because the shorter wildcarded initializer is ambiguous.

[signature.ClientMode]
module=client.dll
pattern=48 8D 1D ?? ?? ?? ?? 48 8B CB 89 05 ?? ?? ?? ?? E8 ?? ?? ?? ?? 48 8B 0D ?? ?? ?? ?? 48 8D 05 ?? ?? ?? ?? 48 89 05 ?? ?? ?? ??
operand=rip_rel32
operand_offset=3
instruction_length=7
indirections=0
required=true
validate_vtable=true
description=ClientModeShared initialization/accessor whose first RIP-relative LEA resolves the live ClientMode object.
discovery=In Ghidra, confirm the ClientModeShared constructor and RTTI/vtable, then search for the unique LEA RBX, initialization flag, constructor call, and derived-vtable assignment sequence.
source=aidocs/004_x64-migration-and-abi.md
source_readme=README.md#tutorial-notes
notes=The current x64 match is client.dll+0x1F1443 and the first LEA resolves client.dll+0x68D4A0. It is a direct object address, so indirections=0.

[interface.ClientEntityList]
module=client.dll
name=VClientEntityList003
required=true
discovery=In Ghidra, search client.dll strings for VClientEntityList003, follow its interface-registration reference, and verify the 8-byte InterfaceReg fields and IClientEntityList method order before calling GetClientEntity.
source=aidocs/004_x64-migration-and-abi.md
source_readme=README.md#tutorial-notes
notes=The interface name and GetClientEntity slot remain stable in the current x64 build, but the interface registry and object pointers are 8 bytes wide.

[interface.EngineClient]
module=engine.dll
name=VEngineClient014
required=true
discovery=In Ghidra, search engine.dll for VEngineClient014, verify the interface object and vtable, and confirm GetViewAngles at slot 19. In this build the slot points to engine.dll+0x70630, which copies three floats from engine.dll+0x53E4E4, +0x53E4E8, and +0x53E4EC.
source=aidocs/004_x64-migration-and-abi.md
source_readme=README.md#tutorial-notes
notes=Use the named interface and slot 19; do not reuse the x86 ClientState +0x4B84 overlay on x64.
