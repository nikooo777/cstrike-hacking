[signature.WeaponInfoLookup]
module=client.dll
pattern=66 3B 0D ?? ?? ?? ?? 73 1E B8 FF FF 00 00 66 3B C8 74 14 0F B7 C1 48 8D 0C 40 48 8B 05 ?? ?? ?? ?? 48 8B 44 C8 10 C3 48 8D 05 ?? ?? ?? ?? C3
operand=match
required=false
validate_vtable=false
description=Weapon-info table lookup used by the fire path to compute the next accuracy penalty.
discovery=In Ghidra (August build addresses), follow C_WeaponCSBase::UpdateAccuracyPenalty to client.dll+0x4D700, confirm that the wrapper reads the ushort at weapon+0xC62, then follow its tail jump to client.dll+0x1DC630 and verify the 0x18-byte table stride and fallback return.
source=aidocs/005_no-spread-and-weapon-accuracy.md
source_readme=README.md#tutorial-notes
notes=2026-09-20 build: the match is the function entry at client.dll+0x1DB800 (August build: +0x1DC630); operand=match returns the function address rather than a RIP-relative data target. Use weapon+0xC62 as the lookup index for this accuracy path; virtual weapon-id slot 371 supplies the fire-call id but is not the input used by client.dll+0x4D700.

[signature.ClientFireBullets]
module=client.dll
pattern=F3 44 0F 11 4C 24 40 4C 8D 44 24 54 F3 0F 11 7C 24 38 8B C8 F3 0F 11 74 24 30 44 8B CF 89 74 24 28 48 8B D3 44 89 64 24 20 E8 ?? ?? ?? ?? 49 8B
operand=rip_rel32
operand_offset=42
instruction_offset=41
instruction_length=5
indirections=0
required=false
validate_vtable=false
description=Local CS fire call site whose rel32 target is FX_FireBullets.
discovery=In Ghidra (August build addresses), follow the active weapon fire path at client.dll+0x236AB0 through the seed, eye-angle, GetInaccuracy, and GetSpread calls; verify the stack arguments immediately before the call to client.dll+0x1FFA30.
source=aidocs/005_no-spread-and-weapon-accuracy.md
source_readme=README.md#tutorial-notes
notes=2026-09-20 build: the unique match is client.dll+0x235E80 and the call at match+0x29 resolves client.dll+0x1FEC00 (August build: +0x236C90 and +0x1FFA30); x64 stack arguments 5/6/7/8 are mode, seed8, inaccuracy, and spread.

[signature.GlobalVars]
module=client.dll
pattern=F3 0F 10 05 ?? ?? ?? ?? F3 0F 5E 80 1C 09 00 00 48 8B 05 ?? ?? ?? ?? F3 0F 59 40 1C E8 ?? ?? ?? ?? 0F 28 CF F3 0F 11 7C 24 70 F3 0F 5C CE
operand=rip_rel32
operand_offset=19
instruction_offset=16
instruction_length=7
indirections=1
required=false
validate_vtable=false
description=UpdateAccuracyPenalty path whose RIP-relative MOV loads the client CGlobalVarsBase pointer.
discovery=In Ghidra (August build addresses), inspect C_WeaponCSBase::UpdateAccuracyPenalty at client.dll+0x2367D0 and confirm the MOV RAX,[RIP+rel32] followed by MULSS XMM0,[RAX+0x1C]. The +0x1C field is interval_per_tick in the matching CGlobalVarsBase layout.
source=aidocs/005_no-spread-and-weapon-accuracy.md
source_readme=README.md#tutorial-notes
notes=2026-09-20 build: the unique match is client.dll+0x235AD4 and the MOV at match+0x10 resolves the pointer slot at client.dll+0x5AE280 inside .data; one indirection yields CGlobalVarsBase. The August build matched at +0x2368E4 and resolved the same slot.

[signature.UpdateAccuracyPenalty]
module=client.dll
pattern=48 89 5C 24 08 57 48 83 EC 50 48 8B D9 E8 ?? ?? ?? ?? 48 8B C8 C7 44 24 20 00 00 00 00 4C 8D 0D ?? ?? ?? ?? 33 D2 4C 8D 05 ?? ?? ?? ?? E8 ?? ?? ?? ??
operand=match
required=false
validate_vtable=false
description=C_WeaponCSBase::UpdateAccuracyPenalty shared implementation used by weapon vtable slot 384.
discovery=In Ghidra (August build addresses), follow the unique slot-384 call at the start of client.dll+0x235FC0, resolve the live AK vtable entry to client.dll+0x2367D0, and verify the movement baseline, recovery-time, global-time, exponential, and weapon+0xCB0 write paths.
