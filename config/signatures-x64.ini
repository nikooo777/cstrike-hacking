[interface.ClientEntityList]
module=client.dll
name=VClientEntityList003
required=true
discovery=In Ghidra, search client.dll strings for VClientEntityList003, follow its interface-registration reference, and verify the 8-byte InterfaceReg fields and IClientEntityList method order before calling GetClientEntity.
source=aidocs/004_x64-migration-and-abi.md
source_readme=README.md#tutorial-notes
notes=The interface name and GetClientEntity slot remain stable in the current x64 build, but the interface registry and object pointers are 8 bytes wide.

[interface.EngineClient]
module=engine.dll
name=VEngineClient014
required=true
discovery=In Ghidra, search engine.dll for VEngineClient014, verify the interface object and vtable, and confirm GetViewAngles at slot 19. In this build the slot points to engine.dll+0x70630, which copies three floats from engine.dll+0x53E4E4, +0x53E4E8, and +0x53E4EC.
source=aidocs/004_x64-migration-and-abi.md
source_readme=README.md#tutorial-notes
notes=Use the named interface and slot 19; do not reuse the x86 ClientState +0x4B84 overlay on x64.

[interface.EngineTrace]
module=engine.dll
name=EngineTraceClient003
required=true
discovery=In Ghidra, confirm the EngineTraceClient003 string and its interface-registration path, then cross-check IEngineTrace::TraceRay at slot 4 in the matching Source SDK header.
source=aidocs/004_x64-migration-and-abi.md
source_readme=README.md#tutorial-notes
notes=Visibility uses MASK_VISIBLE and a filter that skips the local player and candidate. The string is engine.dll+0x3A5440 in the 2026-09-20 build (August +0x3A41E0); slot 4 is unchanged across both builds. Re-verify the interface and slot after a binary update.

[interface.RenderView]
module=engine.dll
name=VEngineRenderView014
required=false
discovery=In Ghidra, follow the VEngineRenderView014 registration to the object vtable, verify GetMatricesForView at slot 50, and inspect the callee for CViewSetup field reads and matrix writes.
source=aidocs/006_bone-esp-and-world-to-screen.md
source_readme=README.md#tutorial-notes
notes=Vtable slot 50 points to engine.dll+0x12EBE0 in both the August and the 2026-09-20 builds. The feature calls it with the final CViewSetup captured from OverrideView and validates every output matrix element before projection.

[interface.ModelInfo]
module=engine.dll
name=VModelInfoClient006
required=false
discovery=In Ghidra, follow the VModelInfoClient006 registration to the object vtable, verify GetStudiomodel at slot 28, and confirm the model-type check before reading the returned studio header.
source=aidocs/006_bone-esp-and-world-to-screen.md
source_readme=README.md#tutorial-notes
notes=The GetStudiomodel entry is engine.dll+0x1CB070 in the 2026-09-20 build (August +0x1CAFC0). The feature uses it only after IClientRenderable::GetModel slot 9 returns a readable model pointer.
