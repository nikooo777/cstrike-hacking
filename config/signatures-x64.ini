# x64 runtime settings and signature provenance for the current CS:S x64 build.
# CMake copies this file to signatures.ini beside the DLL for an x64 build.
#
# The x64 client uses RIP-relative rel32 operands instead of the x86 absolute
# imm32 operands in config/signatures.ini. For RIP-relative operands,
# instruction_offset identifies the instruction inside the matched pattern.
# Re-check every pattern in Ghidra after a game update; require_unique=true is
# intentional.

[settings]
require_unique=true
validate_pointers=true
log_match_offsets=true

[features]
bhop=true
# Bone cache and IClientNetworkable::IsDormant are mapped for this build.
aimbot=true
# Keep triggerbot off until its complete input/target path is validated.
triggerbot=false
norecoil=true
# Read-only camera correction in ClientMode::OverrideView slot 16.
visual_norecoil=true
# The current CS polar path has a matching live trace but remains exploratory.
perfect_nospread=false
# Return false from CreateMove after cmd angle mutation so its caller leaves
# the compensated simulation angles out of the render camera.
silent_angles=true
menu_open=false

[signature.ClientState]
module=engine.dll
pattern=48 83 EC 28 48 8D 0D ?? ?? ?? ?? E8 00 C6 09 00 48 8D 0D ?? ?? ?? ?? 48 83 C4 28 E9 6C F7 30 00
operand=rip_rel32
operand_offset=7
instruction_offset=4
instruction_length=7
indirections=0
required=true
validate_vtable=false
description=Engine static initializer whose first LEA resolves the live CClientState object.
discovery=In Ghidra, confirm CClientState construction at engine.dll+0xA0DF0, then search for the unique initializer with the LEA, constructor call, cleanup LEA, and tail jump sequence.
source=aidocs/004_x64-migration-and-abi.md
source_readme=README.md#tutorial-notes
notes=The current x64 match is engine.dll+0x47E0 and its first RIP-relative LEA resolves engine.dll+0x535810. The call and tail-jump rel32 bytes are kept exact because the shorter wildcarded initializer is ambiguous.

[signature.ClientMode]
module=client.dll
pattern=48 8D 1D ?? ?? ?? ?? 48 8B CB 89 05 ?? ?? ?? ?? E8 ?? ?? ?? ?? 48 8B 0D ?? ?? ?? ?? 48 8D 05 ?? ?? ?? ?? 48 89 05 ?? ?? ?? ??
operand=rip_rel32
operand_offset=3
instruction_length=7
indirections=0
required=true
validate_vtable=true
description=ClientModeShared initialization/accessor whose first RIP-relative LEA resolves the live ClientMode object.
discovery=In Ghidra, confirm the ClientModeShared constructor and RTTI/vtable, then search for the unique LEA RBX, initialization flag, constructor call, and derived-vtable assignment sequence.
source=aidocs/004_x64-migration-and-abi.md
source_readme=README.md#tutorial-notes
notes=The current x64 match is client.dll+0x1F1443 and the first LEA resolves client.dll+0x68D4A0. It is a direct object address, so indirections=0.

[signature.WeaponInfoLookup]
module=client.dll
pattern=66 3B 0D ?? ?? ?? ?? 73 1E B8 FF FF 00 00 66 3B C8 74 14 0F B7 C1 48 8D 0C 40 48 8B 05 ?? ?? ?? ?? 48 8B 44 C8 10 C3 48 8D 05 ?? ?? ?? ?? C3
operand=match
required=false
validate_vtable=false
description=Weapon-info table lookup used by the fire path to compute the next accuracy penalty.
discovery=In Ghidra, follow C_WeaponCSBase::UpdateAccuracyPenalty to client.dll+0x4D700, confirm that the wrapper reads the ushort at weapon+0xC62, then follow its tail jump to client.dll+0x1DC630 and verify the 0x18-byte table stride and fallback return.
source=aidocs/005_no-spread-and-weapon-accuracy.md
source_readme=README.md#tutorial-notes
notes=The match is the function entry at client.dll+0x1DC630 in the sample x64 client; operand=match returns the function address rather than a RIP-relative data target. Use weapon+0xC62 as the lookup index for this accuracy path; virtual weapon-id slot 371 supplies the fire-call id but is not the input used by client.dll+0x4D700.

[signature.ClientFireBullets]
module=client.dll
pattern=F3 44 0F 11 4C 24 40 4C 8D 44 24 54 F3 0F 11 7C 24 38 8B C8 F3 0F 11 74 24 30 44 8B CF 89 74 24 28 48 8B D3 44 89 64 24 20 E8 ?? ?? ?? ?? 49 8B
operand=rip_rel32
operand_offset=42
instruction_offset=41
instruction_length=5
indirections=0
required=false
validate_vtable=false
description=Local CS fire call site whose rel32 target is FX_FireBullets.
discovery=In Ghidra, follow the active weapon fire path at client.dll+0x236AB0 through the seed, eye-angle, GetInaccuracy, and GetSpread calls; verify the stack arguments immediately before the call to client.dll+0x1FFA30.
source=aidocs/005_no-spread-and-weapon-accuracy.md
source_readme=README.md#tutorial-notes
notes=The unique sample match is client.dll+0x236C90. The call at match+0x29 resolves client.dll+0x1FFA30; x64 stack arguments 5/6/7/8 are mode, seed8, inaccuracy, and spread.

[signature.GlobalVars]
module=client.dll
pattern=F3 0F 10 05 ?? ?? ?? ?? F3 0F 5E 80 1C 09 00 00 48 8B 05 ?? ?? ?? ?? F3 0F 59 40 1C E8 ?? ?? ?? ?? 0F 28 CF F3 0F 11 7C 24 70 F3 0F 5C CE
operand=rip_rel32
operand_offset=19
instruction_offset=16
instruction_length=7
indirections=1
required=false
validate_vtable=false
description=UpdateAccuracyPenalty path whose RIP-relative MOV loads the client CGlobalVarsBase pointer.
discovery=In Ghidra, inspect C_WeaponCSBase::UpdateAccuracyPenalty at client.dll+0x2367D0 and confirm the MOV RAX,[RIP+rel32] followed by MULSS XMM0,[RAX+0x1C]. The +0x1C field is interval_per_tick in the matching CGlobalVarsBase layout.
source=aidocs/005_no-spread-and-weapon-accuracy.md
source_readme=README.md#tutorial-notes
notes=The unique sample match is client.dll+0x2368E4. The MOV at match+0x10 resolves the pointer slot at client.dll+0x75E280; one indirection yields CGlobalVarsBase.

[signature.UpdateAccuracyPenalty]
module=client.dll
pattern=48 89 5C 24 08 57 48 83 EC 50 48 8B D9 E8 ?? ?? ?? ?? 48 8B C8 C7 44 24 20 00 00 00 00 4C 8D 0D ?? ?? ?? ?? 33 D2 4C 8D 05 ?? ?? ?? ?? E8 ?? ?? ?? ??
operand=match
required=false
validate_vtable=false
description=C_WeaponCSBase::UpdateAccuracyPenalty shared implementation used by weapon vtable slot 384.
discovery=In Ghidra, follow the unique slot-384 call at the start of client.dll+0x235FC0, resolve the live AK vtable entry to client.dll+0x2367D0, and verify the movement baseline, recovery-time, global-time, exponential, and weapon+0xCB0 write paths.
source=aidocs/005_no-spread-and-weapon-accuracy.md
source_readme=README.md#tutorial-notes
notes=The pattern uniquely matches the function entry at client.dll+0x2367D0 in the sample x64 client. The optional detour records the exact pre/post penalty state for the one-shot F1 diagnostic.

[interface.ClientEntityList]
module=client.dll
name=VClientEntityList003
required=true
discovery=In Ghidra, search client.dll strings for VClientEntityList003, follow its interface-registration reference, and verify the 8-byte InterfaceReg fields and IClientEntityList method order before calling GetClientEntity.
source=aidocs/004_x64-migration-and-abi.md
source_readme=README.md#tutorial-notes
notes=The interface name and GetClientEntity slot remain stable in the current x64 build, but the interface registry and object pointers are 8 bytes wide.

[interface.EngineClient]
module=engine.dll
name=VEngineClient014
required=true
discovery=In Ghidra, search engine.dll for VEngineClient014, verify the interface object and vtable, and confirm GetViewAngles at slot 19. In this build the slot points to engine.dll+0x70630, which copies three floats from engine.dll+0x53E4E4, +0x53E4E8, and +0x53E4EC.
source=aidocs/004_x64-migration-and-abi.md
source_readme=README.md#tutorial-notes
notes=Use the named interface and slot 19; do not reuse the x86 ClientState +0x4B84 overlay on x64.

[interface.EngineTrace]
module=engine.dll
name=EngineTraceClient003
required=true
discovery=In Ghidra, confirm the EngineTraceClient003 string and its interface-registration path, then cross-check IEngineTrace::TraceRay at slot 4 in the matching Source SDK header.
source=aidocs/004_x64-migration-and-abi.md
source_readme=README.md#tutorial-notes
notes=Visibility uses MASK_VISIBLE and a filter that skips the local player and candidate. The current x64 string is engine.dll+0x3A41E0; re-verify the interface and slot after a binary update.
