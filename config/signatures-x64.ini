# x64 runtime settings and signature provenance for the current CS:S x64 build.
# CMake copies this file to signatures.ini beside the DLL for an x64 build.
#
# The x64 client uses RIP-relative rel32 operands instead of the x86 absolute
# imm32 operands in config/signatures.ini. For RIP-relative operands,
# instruction_offset identifies the instruction inside the matched pattern.
# Re-check every pattern in Ghidra after a game update; require_unique=true is
# intentional.

[settings]
require_unique=true
validate_pointers=true
log_match_offsets=true

[features]
bhop=true
# Bone cache and IClientNetworkable::IsDormant are mapped for this build.
aimbot=true
# Keep triggerbot off until its complete input/target path is validated.
triggerbot=false
norecoil=true
# Read-only camera correction in ClientMode::OverrideView slot 16.
visual_norecoil=true
# The current CS polar path has a matching live trace but remains exploratory.
perfect_nospread=false
# Return false from CreateMove after cmd angle mutation so its caller leaves
# the compensated simulation angles out of the render camera.
silent_angles=true
bone_esp=false
menu_open=false

[signature.ClientState]
module=engine.dll
pattern=48 8D 0D ?? ?? ?? ?? E8 ?? ?? ?? ?? 83 3D ?? ?? ?? ?? 06
operand=rip_rel32
operand_offset=3
instruction_offset=0
instruction_length=7
indirections=0
required=true
validate_vtable=false
description=Engine use site that loads the live CClientState object, calls one of its methods, and compares its signon state with SIGNONSTATE_FULL (6).
discovery=In Ghidra, follow the CClientState RTTI to its vtables and constructor, and find the static initializer that passes the live object to that constructor. Then search for a use site of the same object that stays unique with every displacement wildcarded, and confirm that it decodes to the object the initializer constructs.
source=aidocs/004_x64-migration-and-abi.md
source_readme=README.md#tutorial-notes
notes=2026-09-20 build: the match is engine.dll+0x8CE1B and its LEA resolves engine.dll+0x536810, the object that the initializer at engine.dll+0x47E0 passes to the CClientState constructor at engine.dll+0xA0E70. The CMP reads object+0x14C. The pattern also matches the August engine once (+0x8CD9B -> +0x535810). The previous initializer pattern kept exact call and tail-jump rel32 bytes and stopped matching after the 2026-09-20 update.

[signature.ClientMode]
module=client.dll
pattern=48 8D 1D ?? ?? ?? ?? 48 8B CB 89 05 ?? ?? ?? ?? E8 ?? ?? ?? ?? 48 8B 0D ?? ?? ?? ?? 48 8D 05 ?? ?? ?? ?? 48 89 05 ?? ?? ?? ??
operand=rip_rel32
operand_offset=3
instruction_length=7
indirections=0
required=true
validate_vtable=true
description=ClientModeShared initialization/accessor whose first RIP-relative LEA resolves the live ClientMode object.
discovery=In Ghidra, confirm the ClientModeShared constructor and RTTI/vtable, then search for the unique LEA RBX, initialization flag, constructor call, and derived-vtable assignment sequence.
